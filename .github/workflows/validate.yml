name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum
            tools/quality/go.mod
            tools/quality/go.sum
            tools/actionlint/go.mod
            tools/actionlint/go.sum
      - name: Resolve pinned dependencies
        run: make bootstrap
      - name: Run fast verification suite
        run: make verify

  race:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true
      - name: Run race suite
        run: make race

  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true
      - name: Run bounded parser fuzzing
        run: make fuzz

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true
      - name: Build and verify standalone image
        run: make image IMAGE=perfeng-control-plane:ci VCS_REF="$GITHUB_SHA"

  vulnerabilities:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum
            tools/quality/go.mod
            tools/quality/go.sum
            tools/actionlint/go.mod
            tools/actionlint/go.sum
      - name: Resolve pinned dependencies
        run: make bootstrap
      - name: Run supply-chain suite
        run: make supply-chain

  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.11-bookworm@sha256:051f7b7b3abdd564d5d1bd1e8c4b9c1b6e77087d1dd22020ede611c096a272e0
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true
      - name: PostgreSQL integration and restart tests
        env:
          PERFENG_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres?sslmode=disable
        run: make db-validate

  kubernetes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true
      - name: Install kind
        run: go install sigs.k8s.io/kind@v0.31.0
      - name: Create pinned Kubernetes cluster
        env:
          PERFENG_TEST_KUBECONFIG: ${{ runner.temp }}/perfeng-kubeconfig
        run: >-
          kind create cluster
          --name perfeng-test
          --image kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
          --kubeconfig "$PERFENG_TEST_KUBECONFIG"
          --wait 60s
      - name: Kubernetes API integration tests
        env:
          PERFENG_TEST_KUBECONFIG: ${{ runner.temp }}/perfeng-kubeconfig
        run: make kubernetes-validate
      - name: Delete Kubernetes cluster
        if: always()
        run: kind delete cluster --name perfeng-test
